services:
  engram:
    container_name: sdd-engram
    build:
      context: .
      args:
        ENGRAM_VERSION: ${ENGRAM_VERSION:-1.20.0}
    environment:
      ENGRAM_DATA_DIR: /data
      ENGRAM_PORT: "7437"
    volumes:
      - engram-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7437/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  engram-data:
    name: sdd-engram-data
